    const add = async d => { const prev = chain.length ? chain[chain.length - 1].h : 'GENESIS'; chain.push({ d, prev, h: await sha(prev + d) }); };
    el.querySelectorAll('[data-k]').forEach(i => i.onchange = async () => { const old = st[i.dataset.k]; st[i.dataset.k] = i.value; await add(`${i.dataset.k}: ${old} \u2192 ${i.value}`); if (signed) await add('Sign-off withdrawn: data changed after signing'); await stat(); if (signed && (await sha(JSON.stringify(st))) !== signed) signed = null; });
    el.querySelector('#snSign').onclick = async () => { signed = await sha(JSON.stringify(st)); await add('Report signed, snapshot ' + signed.slice(0, 12)); await stat(); };
    el.querySelector('#snTamper').onclick = async () => { if (!chain.length) return toast('Make an edit first to create entries.'); chain[0].d += ' (edited later)'; await stat(); toast('Entry 1 altered. Now verify the chain.'); };
    el.querySelector('#snVerify').onclick = async () => { let prev = 'GENESIS', bad = -1; for (let i = 0; i < chain.length; i++) { const h = await sha(prev + chain[i].d); if (chain[i].prev !== prev || h !== chain[i].h) { bad = i; break; } prev = chain[i].h; } toast(bad < 0 ? `Chain intact (${chain.length} entries).` : `Chain broken at entry ${bad + 1}.`); };
    stat();
  },
  adnoc(el) {
    const M = OHStats.ADNOC_MATRIX, col = { R: '#D33A2C', O: '#EE9A2E', Y: '#F2D533', G: '#4C9A57' };
    const sev = { 6: 'Disastrous', 5: 'Catastrophic', 4: 'Major', 3: 'Serious', 2: 'Minor', 1: 'Notable' }, lk = { A: 'Rare', B: 'Unlikely', C: 'Possible', D: 'Likely', E: 'Very likely', F: 'Almost certain' };
    el.innerHTML = `<div class="tw"><table class="t matrix"><thead><tr><th>Severity \u2193 / Likelihood \u2192</th>${'ABCDEF'.split('').map(l => `<th>${l} ${lk[l]}</th>`).join('')}</tr></thead><tbody>${[6, 5, 4, 3, 2, 1].map(s => `<tr><th>${s} ${sev[s]}</th>${'ABCDEF'.split('').map((l, i) => `<td tabindex="0" role="button" aria-label="${s}${l}" data-s="${s}" data-l="${l}" style="background:${col[M[s][i]]};color:${M[s][i] === 'R' ? '#fff' : '#16232B'}">${s}${l}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div id="adOut" class="callout" style="margin-top:10px">Select a cell to see its rating and required actions.</div>
      <h3>Quantitative stage: 95% UCL as a percentage of the OEL</h3><div class="grid2"><div class="field"><label for="adU">95% UCL = <b id="adUv">35</b>% of OEL</label><input id="adU" type="range" min="0" max="300" value="35"></div><div id="adQ"></div></div>`;
    const act = { 1: 'Stop the high-risk activity, investigate, put all controls in place before work restarts, and monitor until below the OEL. Senior management intervention.', 2: 'Verify controls, monitor and modify until below the OEL, re-monitor annually, health surveillance as appropriate.', 3: 'Regular monitoring (at least every 3 years), improve work practices, verify controls such as PPE.', 4: 'Improve procedures and training (HAZCOM); periodic assessment at least every 5 years.' };
    const pick = td => { el.querySelectorAll('.matrix td').forEach(x => x.classList.remove('sel')); td.classList.add('sel'); const h = OHStats.adnocHRR(td.dataset.s, td.dataset.l);
      el.querySelector('#adOut').innerHTML = `<b>${h.code}: ${h.label}</b>. ${act[h.n]} ${h.n <= 2 ? 'Treated as non-ALARP: a Remedial Action Plan is required.' : 'Treated as ALARP: routine monitoring.'} ${+td.dataset.s >= 3 || h.n <= 3 ? 'Quantitative assessment required, or a recorded justification.' : 'Quantitative assessment not required.'}`; };
    el.querySelectorAll('.matrix td').forEach(td => { td.onclick = () => pick(td); td.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(td); } }; });
    const q = () => { const p = +el.querySelector('#adU').value; el.querySelector('#adUv').textContent = p; const r = p / 100, l = OHStats.adnocQuantLikelihood(r);
      el.querySelector('#adQ').innerHTML = `<table class="kv"><tr><th>Quantitative likelihood</th><td><b>${l} ${lk[l]}</b></td></tr><tr><th>Survey frequency</th><td>${OHStats.adnocFrequency(r)}</td></tr><tr><th>Health Surveillance Plan</th><td>${r > 0.5 ? '<span class="pill warn">Include SEG</span>' : 'Not triggered'}</td></tr><tr><th>With severity 6</th><td>${OHStats.adnocHRR(6, l).code} ${OHStats.adnocHRR(6, l).label}</td></tr></table>`; };
    el.querySelector('#adU').oninput = q; q();
  }
};

// log-probability plot (as in OHA Studio)
function plot(st, oel) {
  if (!st.plot || st.plot.length < 2) return '';
  const W = 440, H = 300, ml = 52, mr = 14, mt = 14, mb = 42, pw = W - ml - mr, ph = H - mt - mb;
  const vals = st.plot.map(p => p.v).concat(oel ? [oel] : []).concat([st.x95]);
  let lo = Math.floor(Math.log10(Math.min(...vals) / 1.2)), hi = Math.ceil(Math.log10(Math.max(...vals) * 1.2)); if (hi === lo) hi = lo + 1;
  const zmin = -2.6, zmax = 2.6, X = z => ml + (z - zmin) / (zmax - zmin) * pw, Y = v => mt + ph - (Math.log10(v) - lo) / (hi - lo) * ph;
  let g = ''; [1, 5, 10, 25, 50, 75, 90, 95, 99].forEach(pc => { const x = X(OHStats.normInv(pc / 100)); g += `<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt + ph}" stroke="#E2E8EC"/><text x="${x}" y="${mt + ph + 15}" font-size="10" text-anchor="middle" fill="#55656F">${pc}</text>`; });
  for (let d = lo; d <= hi; d++) { const y = Y(10 ** d); g += `<line x1="${ml}" x2="${ml + pw}" y1="${y}" y2="${y}" stroke="#D3DBE0"/><text x="${ml - 6}" y="${y + 3.5}" font-size="10" text-anchor="end" fill="#55656F">${F(10 ** d)}</text>`; }
  const lgm = Math.log(st.gm), ls = Math.log(st.gsd), fit = z => Math.exp(lgm + ls * z), cid = 'c' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-probability plot"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff" stroke="#B7C3CA"/>${g}<clipPath id="${cid}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath><line clip-path="url(#${cid})" x1="${X(zmin)}" y1="${Y(fit(zmin))}" x2="${X(zmax)}" y2="${Y(fit(zmax))}" stroke="#55656F" stroke-dasharray="4 3"/>${oel ? `<line x1="${ml}" x2="${ml + pw}" y1="${Y(oel)}" y2="${Y(oel)}" stroke="#B3261E" stroke-width="1.5"/><text x="${ml + pw - 4}" y="${Y(oel) - 5}" font-size="11" text-anchor="end" fill="#B3261E" font-weight="600">OEL ${F(oel)}</text>` : ''}${st.plot.map(p => `<circle cx="${X(p.z)}" cy="${Y(p.v)}" r="4.2" fill="${p.imputed ? '#fff' : '#1D5FA8'}" stroke="#1D5FA8" stroke-width="1.5"/>`).join('')}<text x="${ml + pw / 2}" y="${H - 6}" font-size="11" text-anchor="middle" fill="#16232B">Cumulative probability (%)</text></svg><p style="font-size:12.5px;color:var(--steel);margin:4px 0 0">Filled: measured. Hollow: imputed non-detect. Dashed: fitted lognormal.</p>`;
}

// ======================= QUIZ ENGINE =======================
function quizHTML(qs, final) {
  return `<div class="quiz">${qs.map(q => { const st = final ? P.final.answers[q.id] : P.q[q.id];
    return `<div class="q" data-q="${q.id}">${q.scen ? `<p class="scen">${q.scen}</p>` : ''}<p class="stem">${q.stem}</p><div class="opts">${q.opts.map((o, i) => `<button data-o="${i}"${final && st !== undefined ? ' disabled' : ''} class="${final && st !== undefined ? (i === q.a ? 'right' : i === st ? 'wrong' : '') : (st === 'ok' && i === q.a ? 'right' : '')}">${esc(o)}</button>`).join('')}</div><div class="fb" aria-live="polite">${!final && st === 'ok' ? `<span class="pill ok">Correct</span> ${q.why}` : ''}${final && st !== undefined ? (st === q.a ? '<span class="pill ok">Correct</span>' : '<span class="pill crit">Incorrect</span>') : ''}</div></div>`; }).join('')}</div>`;
}
function bindQuiz(root, qs, mod, final) {
  root.querySelectorAll('.q').forEach(qe => { const q = qs.find(x => x.id === qe.dataset.q);
    qe.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
      const i = +b.dataset.o, fb = qe.querySelector('.fb');
      if (final) { if (P.final.answers[q.id] !== undefined) return; P.final.answers[q.id] = i; save(); qe.querySelectorAll('.opts button').forEach(x => { x.disabled = true; if (+x.dataset.o === q.a) x.classList.add('right'); else if (+x.dataset.o === i) x.classList.add('wrong'); });
        fb.innerHTML = i === q.a ? '<span class="pill ok">Correct</span>' : '<span class="pill crit">Incorrect</span>'; updateFinal(); return; }
      qe.querySelectorAll('.opts button').forEach(x => x.classList.remove('right', 'wrong'));
      if (i === q.a) { b.classList.add('right'); fb.innerHTML = `<span class="pill ok">Correct</span> ${q.why}`; P.q[q.id] = 'ok'; }
      else { b.classList.add('wrong'); fb.innerHTML = '<span class="pill crit">Not quite</span> Try another answer.'; if (P.q[q.id] !== 'ok') P.q[q.id] = 'tried'; }
      save(); checkModule(mod); }); });
}
function checkModule(m) {
  const all = m.quiz.every(q => P.q[q.id] === 'ok');
  if (all && !P.done[m.id]) { P.done[m.id] = true; save(); toast(`Module ${m.n} complete`); renderRail(); const nb = $('#nextHint'); if (nb) nb.innerHTML = '<span class="pill ok">Module complete</span>'; }
}

// ======================= RENDER =======================
let cur = (() => { try { return location.hash.slice(1); } catch (e) { return ''; } })() || P.last || 'm0';
if (cur !== 'final' && !MODS.some(m => m.id === cur)) cur = 'm0';
function renderRail() {
  const total = MODS.length + 1, done = MODS.filter(m => P.done[m.id]).length + (P.final.passed ? 1 : 0);
  $('#progTxt').textContent = `${done} of ${total} complete`; $('#progBar').style.width = (100 * done / total) + '%';
  $('#rail').innerHTML = `<ol class="train">${MODS.concat([{ id: 'final', n: 10, t: 'Final assessment', s: 'Scenarios and certificate' }]).map(m => { const d = m.id === 'final' ? P.final.passed : P.done[m.id]; const started = m.id === 'final' ? Object.keys(P.final.answers).length : (m.quiz || []).some(q => P.q[q.id]);
    return `<li><button data-go="${m.id}"${cur === m.id ? ' aria-current="page"' : ''}><span class="dot ${d ? 'done' : started ? 'started' : ''}" aria-hidden="true">${m.n}</span><span class="lbl"><b>${m.t}</b><span>${m.s}</span></span></button></li>`; }).join('')}</ol>
    <div style="padding:14px 20px;font-size:12.5px;color:var(--steel)"><button class="btn" data-reset style="width:100%">Reset my progress</button></div>`;
  $('#rail').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#rail').querySelector('[data-reset]').onclick = () => { if (confirm('Clear all progress and answers?')) { P = { done: {}, q: {}, final: { answers: {} } }; save(); go('m0'); } };
}
function go(id) { cur = id; P.last = id; save(); try { history.replaceState(null, '', '#' + id); } catch (e) { /* sandboxed preview: address bar cannot change */ } render(); $('#main').scrollTop = 0; $('#main').focus({ preventScroll: true }); }
function render() {
  renderRail();
  if (cur === 'final') return renderFinal();
  const i = MODS.findIndex(m => m.id === cur), m = MODS[i] || MODS[0];
  $('#view').innerHTML = `<div class="mod-head"><div class="num">Module ${m.n} of 10</div><h1>${m.t}</h1><p class="lede">${m.lede}</p><div class="meta-row"><span>About ${m.time}</span><span>${m.s}</span></div></div>
    <div class="sec">${obj(m.obj)}</div>${m.body()}
    <div class="sec"><h2>Knowledge check</h2><p style="font:15px/1.6 var(--serif);color:var(--steel);margin:0 0 4px">Answer every question correctly to complete the module. You can retry.</p>${quizHTML(m.quiz)}
    <div class="next-row"><span id="nextHint">${P.done[m.id] ? '<span class="pill ok">Module complete</span>' : ''}</span><div class="btn-row">${i > 0 ? `<button class="btn" data-go="${MODS[i - 1].id}">Previous module</button>` : ''}<button class="btn primary" data-go="${i < MODS.length - 1 ? MODS[i + 1].id : 'final'}">${i < MODS.length - 1 ? 'Next module' : 'Go to final assessment'}</button></div></div></div>`;
  $('#view').querySelectorAll('[data-lab]').forEach(el => LABS[el.dataset.lab](el));
  bindQuiz($('#view'), m.quiz, m, false);
  $('#view').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function finalScore() { const a = P.final.answers; const n = FINAL.filter(q => a[q.id] === q.a).length; return { n, done: Object.keys(a).length }; }
function updateFinal() {
  const s = finalScore(), el = $('#finalRes'); if (!el) return;
  if (s.done < FINAL.length) { el.innerHTML = `<p style="color:var(--steel)">${s.done} of ${FINAL.length} answered.</p>`; return; }
  const pct = Math.round(100 * s.n / FINAL.length), pass = pct >= 80;
  if (pass && !P.final.passed) { P.final.passed = true; P.final.date = new Date().toISOString().slice(0, 10); P.final.score = pct; save(); renderRail(); }
  el.innerHTML = pass ? `<div class="callout ok no-print"><b>Passed with ${pct}%.</b> Enter your name to complete your certificate.</div>
    <div class="field no-print" style="max-width:360px"><label for="certName">Name for the certificate</label><input id="certName" value="${esc(P.final.name || '')}"></div>
    <div class="cert" id="cert"><svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1D5FA8"/><path d="M7 23 L13 15 L18 19 L25 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg><h2>Certificate of completion</h2><p style="margin:0;color:var(--steel)">This certifies that</p><div class="who" id="certWho">${esc(P.final.name || 'Your name')}</div><p style="margin:0">has completed the <b>OHA Studio training programme</b> (10 modules and the final assessment)</p><p style="color:var(--steel)">Score ${P.final.score || pct}% · ${esc(P.final.date || '')} · Risk2Safe / H²S Consultants</p></div>
    <div class="btn-row no-print" style="margin-top:12px"><button class="btn primary" id="printCert">Print certificate</button><button class="btn" id="retake">Retake assessment</button></div>`
    : `<div class="callout crit"><b>${pct}%.</b> The pass mark is 80%. Review the modules for the questions you missed, then retake.</div><div class="btn-row"><button class="btn primary" id="retake">Retake assessment</button></div>`;
  const nm = $('#certName'); if (nm) nm.oninput = () => { P.final.name = nm.value; save(); $('#certWho').textContent = nm.value || 'Your name'; };
  const pr = $('#printCert'); if (pr) pr.onclick = () => window.print();
  $('#retake').onclick = () => { P.final.answers = {}; P.final.passed = false; save(); render(); };
}
function renderFinal() {
  const ready = MODS.filter(m => P.done[m.id]).length;
  $('#view').innerHTML = `<div class="mod-head no-print"><div class="num">Module 10 of 10</div><h1>Final assessment</h1><p class="lede">Fourteen scenarios drawn from the whole workflow. Each question allows one attempt. The pass mark is 80%, and passing unlocks a printable certificate.</p><div class="meta-row"><span>About 15 min</span><span>${ready} of ${MODS.length} modules completed</span></div></div>
    ${ready < MODS.length ? `<div class="callout warn no-print">You have completed ${ready} of ${MODS.length} modules. You can take the assessment now, but finishing the modules first is recommended.</div>` : ''}
    <div class="sec no-print">${quizHTML(FINAL, true)}</div><div class="sec" id="finalRes"></div>`;
  bindQuiz($('#view'), FINAL, null, true); updateFinal();
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== cur) { cur = h; render(); } });
render();

</script>
</body>
